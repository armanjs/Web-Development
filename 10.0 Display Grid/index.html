    /* Each square should be 100px by 100px */
    /* My colours for white: #f0d9b5, black: #b58863
    https://appbrewery.github.io/grid-vs-flexbox/ */

    .container {
      width: 800px; /* set the grid to 8x100px since grid will 
      automatically try to use all the horizontal space */
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr; /* 8 cols */
      grid-template-rows: 1fr 1fr 1fr 1fr 1fr 1fr 1fr 1fr; /* 8 rows */
    }

    .white {
      width: 100px;
      height: 100px;
      background-color: #f0d9b5;
    }

    .black {
      width: 100px;
      height: 100px;
      background-color: #b58863;
