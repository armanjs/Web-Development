<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Repeat Grid</title>
  <style>
    .grid-container {
      display: grid; /* repeat 200px 2x */
      grid-template-rows: repeat(2, 200px); /* 200px 200px */
      grid-template-columns: repeat(2, 200px); /* 2x2 grid but we have 5 items */
      grid-auto-rows: 300px; /* if you have an extra element 
      that doesnt fit in the grid set the height to 300px */
    }

    .grid-item {
      font-size: 3rem;
      background-color: darkviolet;
      border: 5px solid goldenrod;
      color: white;
    }
  </style>
</head>

<body>
  <h1>Repeat</h1>
  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
  </div>
</body>

</html>
