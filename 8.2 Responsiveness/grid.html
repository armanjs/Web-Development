<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>
  <style>
    /* grid is for 2D styling */
    .grid-container {
      display: grid;
      grid-template-columns: 1fr 1fr; /* 2 fractions => divide the screen into 2 equal sized fractions */
      grid-template-rows: 100px 200px 200px; /* hight of each row from top to bottom */
      gap: 30px;
    }

    .first {
      grid-column: span 2; /* 2 col width */
    }

    .card {
      background-color: blue;
    }
  </style>
</head>

<body>
  <h1>CSS Grid</h1>
  <div class="grid-container">
    <div class="first card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
    <div class="card"></div>
  </div>

</body>

</html>
