<!DOCTYPE html>

<head>
  <title>CSS Display Property Example</title>
  <style>
    p {
      color: white;
    }

    .red {
      display: block; /* will take up a full width of the page (default) */
      width: 200px;
      height: 200px;
      background-color: red;
    }

    .green {
      display: inline; /* cannot set the width and hight, adjusts to the size of text */
      width: 200px;
      height: 200px;
      background-color: green;
    }

    .blue {
      display: inline-block; /* can set hight and width + elemets can go in the same line */
      width: 200px;
      height: 200px;
      background-color: blue;
    }
    /* display: none => makes it disapear like checking off a box */
  </style>
</head>


<body>
  <h1>CSS Display Property</h1>
  <p class="red">Red Paragraph </p>
  <p class="green">Green Paragraph</p>
  <p class="blue">Blue Paragraph</p>
</body>

</html>
