<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Font-Size</title>
    <style>
      #pixel {
        font-size: 20px;
      }

      #point {
        font-size: 20pt;
      }

      /* 1em => 100% of parent can be confusing */
      #em {
        font-size: 1em; /* if parent is 80px then 2em = 2 x 80 = 160px */
      }

      #rem { /* 100% of root element <html> recommended */
        font-size: 1rem;
      }

      footer {
        font-size: 12pt;
      }

      html { /* root element */
        font-size: xx-large; /* named font size */
      }
    </style>
  </head>

  <body>
    <p id="pixel">1 Pixel is 1/96 of an Inch</p> <!-- Static -->
    <p id="point">1 Point is 1/72 of an Inch</p> <!-- Static -->
    <footer> <!--if parent <footer> is 80px-->
      <p id="em">1em is 100% the size of the parent element</p> <!-- Relative -->
      <p id="rem">1rem is 100% the size of the root element</p> <!-- Relative -->
    </footer>
  </body>
</html>
