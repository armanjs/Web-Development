<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Box Model</title>
  <style>
    /* Write your CSS code here */
    div { /* set all the div elemets to these properties */
      width: 200px;
      height: 200px;
    }

    p { /* distance between any border = margin */
      margin: 0px; /* remove margins */
    } /* each paragraph element get 1em margin at the start and end */

    #green-box {
      background-color: cadetblue;
      border: 10px solid black; /* thickness style color */
      padding: 20px; /* push border out by 20px */
    }

    #yellow-box {
      background-color: gold;
      border: 30px solid black; /* can be overwritten using border-width */
      /* border-width: 20px 10px 20px 10px; /* top right bottom left */
      border-width: 20px 10px; /*top/bottom = 20px left/right = 10px */
      margin-left: 260px; /* 200px (width) + (10x2 borders) + (20x2 padding) = 260px */
    }

    #red-box {
      background-color: indianred;
      border: 10px solid black;
      margin-left: 40px; /* 260px - 200px - 20px = 40px */
    }

  </style>
</head>

<body>
